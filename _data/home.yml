Intro: 
  <h3>Hello!</h3>

  <p style="font-size:115%;">I am a final year Ph.D. candidate in Mechanical Engineering at <a href="https://www.stanford.edu/">Stanford University</a>, advised by <a href="https://tartakovsky.stanford.edu/">Prof. Daniel Tartakovsky</a> and <a href="https://me.stanford.edu/people/eric-darve">Prof. Eric Darve</a>. My research focuses on inverse problems, data assimilation (DA), uncertainty quantification (UQ), and probabilistic estimation in highly nonlinear dynamical systems. I develop optimization and machine learning methods for state estimation, forecasting, and sequential decision-making under uncertainty, with current work centered on deep probabilistic models for particle filtering and the assimilation of sparse and binary observations.</p>

  <p style="font-size:115%;">My work combines tools from optimization, machine learning, scientific computing, and stochastic modeling, with applications spanning computational engineering, forecasting, and control. I am broadly interested in scalable and data-efficient inference algorithms for high-dimensional systems.</p>

  <p style="font-size:115%;">Alongside my academic research, I have worked on optimization, forecasting, and quantitative modeling problems in both research and industry settings, including internships at Qube Research &amp; Technologies, Los Alamos National Laboratory, and EPFL.</p>

  <p style="font-size:115%;">In June 2023, I received a Master of Science (MS) degree in Mechanical Engineering with a specialization in automatic and learning-based control from <a href="https://www.stanford.edu/">Stanford University</a>. Prior to Stanford, I completed my Bachelor of Technology (B.Tech.) with Honors at <a href="https://www.iitb.ac.in">IIT Bombay</a>.</p>

  <p style="font-size:115%;">More details about my research can be found on the <a href="/research.html">Research Page</a>.</p>

